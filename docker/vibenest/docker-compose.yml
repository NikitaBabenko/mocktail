# Local Compose companion. On VibeNest use the single-service Dockerfile recipe;
# configure its /db persistent volume and both secret environment variables first.
services:
  mocktail:
    build: ../..
    ports:
      - "127.0.0.1:6625:6625"
    environment:
      MOCKTAIL_ADMIN_KEY: ${MOCKTAIL_ADMIN_KEY:?Set a private management key of at least 32 characters}
      MOCKTAIL_API_KEY: ${MOCKTAIL_API_KEY:?Set a different mock API key of at least 32 characters}
    volumes:
      - mocktail-db:/db
volumes:
  mocktail-db:
